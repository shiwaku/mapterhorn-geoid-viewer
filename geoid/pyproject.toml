[project]
name = "geoid-tiles"
version = "0.1.0"
description = "EGM2008 ジオイド高を Terrarium エンコードの PMTiles に変換する"
requires-python = ">=3.15.1"
dependencies = [
    "imagecodecs>=2026.10.10",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pmtiles>=3.8.1",
    "tifffile>=2026.10.15",
]

[tool.uv]
required-version = ">=0.13.5"
exclude-newer = "7 days"
package = false

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
